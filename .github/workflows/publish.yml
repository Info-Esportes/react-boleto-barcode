name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for npm's OIDC trusted publishing
      contents: write # required for creating the GitHub release
    steps:
      - uses: actions/checkout@v4

      # Trusted publishing requires npm CLI >=11.5.1 and Node >=22.14.0.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g npm@latest

      # The tag commit (created by scripts/release.sh) already contains a built dist/ and
      # the release-only package.json - no install or build step needed here. No auth token:
      # npm authenticates via GitHub's OIDC identity once the trusted publisher is configured
      # on npmjs.com for this repo + workflow filename.
      - run: npm publish --access public --provenance

      - run: gh release create "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
